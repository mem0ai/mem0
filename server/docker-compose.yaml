version: "3.9"

services:
  mem0-api:
    build:
      context: https://github.com/robersonnaves/mem0.git#main:server
      dockerfile: Dockerfile
    image: mem0ai/mem0-server:local
    container_name: mem0-api-server
    restart: unless-stopped
    ports:
      - "8888:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - mem0_app_data:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mem0_network
    dns_search: dns.podman

  postgres:
    image: pgvector/pgvector:pg17
    container_name: mem0-postgres
    restart: unless-stopped
    shm_size: "128mb"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=postgres
    volumes:
      - mem0_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mem0_network
    dns_search: dns.podman

  dashboard:
    image: mem0/dashboard:latest
    container_name: mem0-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://mem0-api:8000
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
    depends_on:
      - mem0-api
    networks:
      - mem0_network
    dns_search: dns.podman

networks:
  mem0_network:
    name: mem0_network
    driver: bridge

volumes:
  mem0_app_data:
    name: mem0-app-data
  mem0_postgres_data:
    name: mem0-postgres-data
