services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"

  pgvector:
    image: pgvector/pgvector:pg17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: mem0
      POSTGRES_DB: mem0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0"]
      interval: 2s
      retries: 15
