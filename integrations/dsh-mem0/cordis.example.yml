# Example DeepSeek Harness config that loads dsh-mem0 alongside the built-in
# tools plugin. Load with:
#
#   pnpm dsh web --patch ./integrations/dsh-mem0/cordis.example.yml
#
# The tools plugin (and its system-prompt dependency) must be present, because
# the memory tools contribute schemas the system prompt renders.

- name: "@deepseek-ai/dsh-system-prompt"
- name: "@deepseek-ai/dsh-tools"
- insert:
    - id: mem0
      # Absolute path to the built plugin (run `npm run build` first), or point
      # at src/index.ts when running through tsx during development.
      name: "/absolute/path/to/mem0/integrations/dsh-mem0/dist/index.js"
      config:
        # apiKey is read from the MEM0_API_KEY env var when omitted here.
        userId: "hims"
        # host: "http://localhost:8000"   # optional: self-hosted / local sandbox
