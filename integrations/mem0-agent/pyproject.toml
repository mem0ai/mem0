[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mem0-agent"
version = "0.1.0"
description = "Coding-agent memory for Claude Code and friends, built on the Mem0 platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
keyring = ["keyring>=24"]
dev = ["pytest>=8", "keyring>=24"]

[project.scripts]
mem0-agent = "mem0_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mem0_agent"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
