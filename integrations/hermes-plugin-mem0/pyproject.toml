[project]
name = "hermes-plugin-mem0"
version = "1.3.0"
description = "Hermes Agent memory provider plugin: mem0"
requires-python = ">=3.11"
license = { text = "Apache-2.0 AND MIT" }
# Installed into the Hermes venv by `hermes plugins install` / `enable` and re-applied after
# every `hermes update` (hermes-agent#113851). Keep upper bounds: Hermes pins its own deps exactly
# and refuses a plugin whose requirements cannot resolve against them.
dependencies = [
    "mem0ai>=2.0.10,<3",
    "httpx>=0.27,<1",
    # The OSS wizard offers Ollama for the LLM and the embedder. mem0ai only ships the `ollama`
    # client under its own `llms` extra, while `mem0/embeddings/ollama.py` imports it as soon as
    # the embedder is `ollama`, and Hermes installs a plugin from this file's `dependencies`
    # (pm/plugin_declarations.py prefers a plugin's pyproject.toml over plugin.yaml). An opt-in
    # extra cannot cover that: pm prunes a recorded extra unless the agent tree declares it.
    "ollama>=0.3.0,<1",
]

[project.optional-dependencies]
postgres = ['psycopg2-binary>=2.9,<3']
qdrant = ['qdrant-client>=1.9,<2']
