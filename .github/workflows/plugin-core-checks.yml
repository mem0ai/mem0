name: Plugin Core Checks

# Shared core for all Mem0 agent plugins. On PRs this is invoked by
# ci-gate.yml (the single required check); push-to-main and manual runs
# remain standalone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'integrations/plugin-core/**'
      - '.github/workflows/plugin-core-checks.yml'
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        run: pip install pytest ruff

      - name: Lint
        working-directory: integrations/plugin-core
        run: python3 -m ruff check .
