name: strands-mem0 CI

# On PRs this is invoked by ci-gate.yml (the single required check);
# push-to-main and manual runs remain standalone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'integrations/strands-mem0/**'
      - '.github/workflows/strands-mem0-checks.yml'
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        working-directory: integrations/strands-mem0/python
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: integrations/strands-mem0/python
        run: ruff check .

      - name: Check formatting
        working-directory: integrations/strands-mem0/python
        run: ruff format --check .

      - name: Type-check with mypy
        working-directory: integrations/strands-mem0/python
        run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        working-directory: integrations/strands-mem0/python
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: integrations/strands-mem0/python
        run: pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hatch
        run: pip install hatch

      - name: Build
        working-directory: integrations/strands-mem0/python
        run: hatch build --clean

      - name: Verify dist output
        run: |
          ls integrations/strands-mem0/python/dist/*.whl || (echo "Wheel file missing" && exit 1)
          ls integrations/strands-mem0/python/dist/*.tar.gz || (echo "Source dist missing" && exit 1)
