name: Feature Request
description: Propose a change to what mem0 does
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Opening this does not mean the feature will be built, and it is not a
        licence to open a pull request. A maintainer labels the issue `accepted`
        when we agree it is work we want. Pull requests that don't link an
        accepted issue are closed automatically.

        Start with the problem, not the solution. Proposals that describe an
        implementation without a concrete use case are usually closed.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched open and closed issues and this is not a duplicate.
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of mem0 does this relate to?
      options:
        - Python SDK
        - TypeScript SDK
        - Vector Store
        - Plugin
        - REST API
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do that mem0 makes hard or impossible today?
        Describe the situation you hit, not the feature you want.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      description: The workaround you are currently living with, and why it is not enough.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it might work. API sketches or pseudocode welcome.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
