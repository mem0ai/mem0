name: Documentation Issue
description: Something in the docs is wrong, missing, or unclear
labels: ["documentation"]

body:
  - type: markdown
    attributes:
      value: |
        Documentation-only pull requests skip the accepted-issue gate, so if you
        already know the fix you can open one directly instead of filing this.

  - type: input
    id: page
    attributes:
      label: Page
      placeholder: "https://docs.mem0.ai/open-source/python-quickstart"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the specific text that is incorrect, unclear, or missing.
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
    validations:
      required: false
